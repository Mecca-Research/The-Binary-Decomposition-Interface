
name: CRRSS Release

on:
  release:
    types: [created, published]
  workflow_dispatch:
    inputs:
      version:
        description: 'Release version'
        required: true
        default: 'v1.0.0'

jobs:
  build-release:
    name: Build Release Artifacts
    runs-on: ubuntu-latest
    strategy:
      matrix:
        platform: [linux-x86_64]
        
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        
      - name: Set up build environment
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc g++ make clang
          
      - name: Build CRRSS (release mode)
        working-directory: tools/crrss
        env:
          BUILD_MODE: release
        run: |
          make clean
          make all BUILD_MODE=release
          
      - name: Run tests
        working-directory: tools/crrss
        run: |
          make test
          ./tests/system_test.sh
          
      - name: Package release
        working-directory: tools/crrss
        run: |
          mkdir -p release
          cp build/bin/crrss release/
          cp build/lib/libcrrss.a release/
          cp README.md release/
          cp CLI_USER_GUIDE.md release/
          cp -r docs release/
          
          # Create tarball
          tar czf crrss-${{ github.event.inputs.version }}-${{ matrix.platform }}.tar.gz release/
          
      - name: Upload release artifacts
        uses: actions/upload-artifact@v4
        with:
          name: crrss-${{ matrix.platform }}
          path: tools/crrss/crrss-*.tar.gz
          
      - name: Upload to release
        if: github.event_name == 'release'
        uses: actions/upload-release-asset@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          upload_url: ${{ github.event.release.upload_url }}
          asset_path: tools/crrss/crrss-${{ github.event.inputs.version }}-${{ matrix.platform }}.tar.gz
          asset_name: crrss-${{ github.event.inputs.version }}-${{ matrix.platform }}.tar.gz
          asset_content_type: application/gzip
