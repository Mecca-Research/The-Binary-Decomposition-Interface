
name: CRRSS Nightly Build

on:
  schedule:
    # Run every day at 2 AM UTC
    - cron: '0 2 * * *'
  workflow_dispatch:

jobs:
  nightly-build:
    name: Nightly Build and Test
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          
      - name: Set up build environment
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc g++ make clang valgrind cppcheck
          
      - name: Build CRRSS (debug mode)
        working-directory: tools/crrss
        run: |
          make clean
          make all BUILD_MODE=debug
          
      - name: Run comprehensive tests
        working-directory: tools/crrss
        run: |
          # Run unit tests
          make test
          
          # Run system tests
          ./tests/system_test.sh
          
      - name: Run memory leak detection
        working-directory: tools/crrss
        run: |
          echo "Running memory leak detection..."
          for test in build/test/test_*; do
            if [ -x "$test" ]; then
              echo "Checking $test..."
              valgrind --leak-check=full --show-leak-kinds=all \
                --track-origins=yes --verbose \
                --log-file="valgrind-$(basename $test).log" \
                "$test" || true
            fi
          done
          
      - name: Run static analysis
        working-directory: tools/crrss
        run: |
          echo "Running cppcheck..."
          cppcheck --enable=all --inconclusive --xml --xml-version=2 \
            --suppress=missingIncludeSystem \
            -I. -Icommon -Ibpme -Isciv -Imemory_layer -Imsm -Istp -Itdt -Icli \
            . 2> cppcheck-report.xml || true
          
      - name: Analyze BDI codebase
        run: |
          echo "Running CRRSS analysis on BDI codebase..."
          make crrss-check || true
          
      - name: Generate reports
        if: always()
        run: |
          echo "Generating nightly reports..."
          echo "Date: $(date)" > nightly-report.txt
          echo "Commit: $(git rev-parse HEAD)" >> nightly-report.txt
          echo "Branch: $(git branch --show-current)" >> nightly-report.txt
          
      - name: Upload nightly artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: nightly-build-${{ github.run_number }}
          path: |
            tools/crrss/build/
            tools/crrss/*.log
            tools/crrss/*.xml
            tools/crrss/*.txt
            nightly-report.txt
          retention-days: 30
