
name: CRRSS CI/CD Pipeline

on:
  push:
    branches: [ main, develop, 'feature/**', 'bugfix/**' ]
    paths:
      - 'tools/crrss/**'
      - '.github/workflows/crrss-ci.yml'
  pull_request:
    branches: [ main, develop ]
    paths:
      - 'tools/crrss/**'
  workflow_dispatch:

jobs:
  build-and-test:
    name: Build and Test CRRSS
    runs-on: ubuntu-latest
    strategy:
      matrix:
        build_mode: [debug, release]
        
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          
      - name: Set up build environment
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc g++ make clang clang-format clang-tidy \
            cppcheck valgrind python3 python3-pip
          
      - name: Display system information
        run: |
          echo "=== System Information ==="
          gcc --version
          make --version
          clang --version
          python3 --version
          echo "=========================="
          
      - name: Build CRRSS (${{ matrix.build_mode }})
        working-directory: tools/crrss
        env:
          BUILD_MODE: ${{ matrix.build_mode }}
        run: |
          echo "Building CRRSS in $BUILD_MODE mode..."
          make clean
          make all BUILD_MODE=$BUILD_MODE
          
      - name: Validate build
        working-directory: tools/crrss
        run: |
          make validate
          
      - name: Run unit tests
        working-directory: tools/crrss
        run: |
          make test
          
      - name: Run system tests
        working-directory: tools/crrss
        run: |
          ./tests/system_test.sh
          
      - name: Check for memory leaks (debug mode only)
        if: matrix.build_mode == 'debug'
        working-directory: tools/crrss
        run: |
          echo "Running memory leak detection..."
          # Run each test with valgrind
          for test in build/test/test_*; do
            if [ -x "$test" ]; then
              echo "Checking $test..."
              valgrind --leak-check=full --error-exitcode=1 "$test" || exit 1
            fi
          done
          
      - name: Archive build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: crrss-${{ matrix.build_mode }}-${{ github.sha }}
          path: |
            tools/crrss/build/bin/crrss
            tools/crrss/build/lib/libcrrss.a
          retention-days: 7
          
      - name: Archive test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports-${{ matrix.build_mode }}-${{ github.sha }}
          path: |
            tools/crrss/*.txt
            tools/crrss/*.json
            tools/crrss/*.html
          retention-days: 7

  code-quality:
    name: Code Quality Checks
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        
      - name: Set up build environment
        run: |
          sudo apt-get update
          sudo apt-get install -y clang-format clang-tidy cppcheck
          
      - name: Check code formatting
        run: |
          echo "Checking code formatting with clang-format..."
          find tools/crrss -name '*.c' -o -name '*.h' | \
            xargs clang-format -style=file --dry-run -Werror
          
      - name: Run clang-tidy
        working-directory: tools/crrss
        run: |
          echo "Running clang-tidy static analysis..."
          find . -name '*.c' | xargs clang-tidy -checks='*' --warnings-as-errors='*' || true
          
      - name: Run cppcheck
        working-directory: tools/crrss
        run: |
          echo "Running cppcheck static analysis..."
          cppcheck --enable=all --error-exitcode=0 \
            --suppress=missingIncludeSystem \
            --suppress=unusedFunction \
            -I. -Icommon -Ibpme -Isciv -Imemory_layer -Imsm -Istp -Itdt -Icli \
            . || true

  security-scan:
    name: Security Scanning
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        
      - name: Run security scan
        run: |
          echo "Scanning for security vulnerabilities..."
          # Check for common security issues
          echo "Checking for unsafe functions..."
          if grep -r "strcpy\|strcat\|sprintf\|gets" tools/crrss --include="*.c" --include="*.h"; then
            echo "WARNING: Unsafe functions detected"
          fi
          
          echo "Checking for hardcoded credentials..."
          if grep -ri "password\|secret\|key" tools/crrss --include="*.c" --include="*.h" | grep -v "// " | grep -v "/\*"; then
            echo "WARNING: Possible hardcoded credentials"
          fi
          
      - name: Check buffer overflow fixes (PR#182)
        working-directory: tools/crrss
        run: |
          echo "Verifying buffer overflow fixes from PR#182..."
          # Check that CRRSS_MAX_BUFFER_CAPACITY is defined
          if ! grep -q "CRRSS_MAX_BUFFER_CAPACITY" cli/crrss_cli.c; then
            echo "ERROR: CRRSS_MAX_BUFFER_CAPACITY not defined"
            exit 1
          fi
          
          # Check that clamping is in place
          if ! grep -q "clamping" cli/crrss_cli.c; then
            echo "WARNING: Clamping logic may be missing"
          fi
          
          echo "✓ Buffer overflow fixes verified"

  integration-test:
    name: Integration Testing
    runs-on: ubuntu-latest
    needs: build-and-test
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        
      - name: Set up build environment
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc make
          
      - name: Build CRRSS
        working-directory: tools/crrss
        run: |
          make clean
          make all
          
      - name: Test CLI tool
        working-directory: tools/crrss
        run: |
          echo "Testing CRRSS CLI tool..."
          ./build/bin/crrss --version
          ./build/bin/crrss --help
          
      - name: Test CRRSS on BDI codebase
        run: |
          echo "Running CRRSS analysis on BDI codebase..."
          make crrss-check || true
          
      - name: Verify integration
        run: |
          echo "Verifying CRRSS integration..."
          # Check that CRRSS can be built from root Makefile
          make crrss
          # Check that CRRSS tests can be run from root
          make crrss-test

  documentation:
    name: Documentation Check
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        
      - name: Check documentation
        working-directory: tools/crrss
        run: |
          echo "Checking documentation..."
          
          # Check that key documentation files exist
          docs=(
            "README.md"
            "CLI_USER_GUIDE.md"
            "docs/USAGE.md"
            "docs/INTEGRATION.md"
          )
          
          for doc in "${docs[@]}"; do
            if [ -f "$doc" ]; then
              echo "✓ Found: $doc"
            else
              echo "✗ Missing: $doc"
              exit 1
            fi
          done
          
      - name: Validate Markdown
        run: |
          echo "Validating Markdown files..."
          find tools/crrss -name '*.md' -exec echo "Checking: {}" \;

  notify-status:
    name: Notification
    runs-on: ubuntu-latest
    needs: [build-and-test, code-quality, security-scan, integration-test, documentation]
    if: always()
    
    steps:
      - name: Check status
        run: |
          echo "=== CI/CD Pipeline Status ==="
          echo "Build and Test: ${{ needs.build-and-test.result }}"
          echo "Code Quality: ${{ needs.code-quality.result }}"
          echo "Security Scan: ${{ needs.security-scan.result }}"
          echo "Integration Test: ${{ needs.integration-test.result }}"
          echo "Documentation: ${{ needs.documentation.result }}"
          echo "============================"
          
          if [[ "${{ needs.build-and-test.result }}" == "failure" ]] || \
             [[ "${{ needs.code-quality.result }}" == "failure" ]] || \
             [[ "${{ needs.security-scan.result }}" == "failure" ]] || \
             [[ "${{ needs.integration-test.result }}" == "failure" ]] || \
             [[ "${{ needs.documentation.result }}" == "failure" ]]; then
            echo "❌ Pipeline failed"
            exit 1
          else
            echo "✅ Pipeline succeeded"
          fi
