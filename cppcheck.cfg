
<?xml version="1.0"?>
<project>
    <root name="BDI C23 Modernization"/>
    <builddir>build</builddir>
    <analyze-all-vs-configs>true</analyze-all-vs-configs>
    <check-headers>true</check-headers>
    <check-unused-templates>true</check-unused-templates>
    <max-ctu-depth>4</max-ctu-depth>
    <max-template-recursion>100</max-template-recursion>
    
    <paths>
        <dir name="C/"/>
    </paths>
    
    <exclude>
        <path name="build/"/>
        <path name="tests/"/>
    </exclude>
    
    <libraries>
        <library>posix</library>
        <library>gnu</library>
    </libraries>
    
    <suppressions>
        <suppression>missingIncludeSystem</suppression>
        <suppression>unusedFunction</suppression>
    </suppressions>
