
# BDI Modular Kernel - Latency-Optimized Profile
# Optimized for low-latency, real-time applications

name: "latency"
type: "LATENCY"
description: "Optimized for minimal latency and real-time responsiveness"

# Optimization objectives
objectives:
  latency: 1.0      # Maximum priority - minimize latency
  throughput: 0.2   # Low priority - latency over throughput
  energy: 0.1       # Low priority - performance over efficiency
  memory: 0.3       # Medium priority - memory latency matters

# System constraints
constraints:
  min_freq_ghz: 3.0           # High frequency for low latency
  max_power_watts: 200        # Moderate power budget
  prefer_hugepages: true      # Reduce TLB misses
  numa_spread: false          # Keep data local for low latency
  min_memory_gb: 16           # Sufficient memory for caching
  require_stable_tsc: true    # Need stable timing

# Module preferences
modules:
  memory_ops:
    - "memcpy.avx2"           # Fast but not necessarily highest throughput
    - "memcpy.sse4"           # Reliable fallback
  
  memory_management:
    - "paging.attention"      # Smart memory management
    - "paging.pinned"         # Pin critical pages
  
  scheduler:
    - "sched.rt_priority"     # Real-time priority scheduler
    - "sched.graph_rt"        # Graph-aware RT scheduler
  
  interrupt_handling:
    - "irq.low_latency"       # Optimized interrupt handling
    - "irq.polling"           # Polling mode for ultra-low latency

# Memory management configuration
memory_management:
  policy: "attention"
  
  attention_config:
    learning_rate: 0.02       # Conservative learning for stability
    recency_decay: 0.95       # Medium decay rate
    hotness_learning: 0.1     # Moderate sensitivity
    regularization: 0.01      # Prevent overfitting
    
    weights:
      attention: 0.6          # High attention weight
      recency: 0.3            # High recency weight for real-time
      hotness: 0.1            # Lower hotness weight
      numa_locality: 0.2      # NUMA locality important for latency
      criticality: 0.4        # Critical pages get priority
    
    thresholds:
      eviction: 0.3           # Conservative eviction
      promotion: 0.7          # Promote frequently accessed
      demotion: 0.2           # Conservative demotion
    
    update_frequency: 1000    # Regular updates
    gc_frequency: 10000       # Less frequent GC to avoid latency spikes
    enable_prefetching: true  # Predictive prefetching
    numa_balancing: true      # NUMA-aware for latency

# Hardware-specific optimizations
hardware_optimizations:
  cpu:
    prefer_features:
      - "avx2"                # Good balance of performance and compatibility
      - "rdtsc"               # Precise timing
      - "constant_tsc"        # Stable timing source
    
    cache_policy: "latency"   # Optimize for cache latency
    prefetch_distance: 2      # Short prefetch for low latency
    cpu_affinity: "strict"    # Strict CPU affinity
  
  memory:
    hugepage_size: "2MB"      # 2MB hugepages for balance
    numa_policy: "local"      # Local allocation
    bandwidth_priority: "latency"  # Latency over bandwidth
  
  interrupts:
    mode: "edge_triggered"    # Edge-triggered for lower latency
    coalescing: false         # Disable interrupt coalescing
    cpu_isolation: true       # Isolate interrupt handling

# Performance targets
performance_targets:
  max_latency_us: 100         # Target max 100μs latency
  avg_latency_us: 10          # Target avg 10μs latency
  jitter_us: 5                # Target max 5μs jitter
  context_switch_us: 2        # Target 2μs context switches
  interrupt_latency_us: 1     # Target 1μs interrupt latency

# Real-time configuration
realtime:
  enable_rt_kernel: true
  rt_priority_levels: 100
  preemption_model: "full"
  tick_rate_hz: 1000
  
  isolation:
    isolate_cpus: [2, 3]      # Isolate CPUs for RT tasks
    nohz_full: true           # Disable ticks on isolated CPUs
    rcu_nocbs: true           # RCU callback offloading

# Monitoring and adaptation
monitoring:
  enable_latency_tracking: true
  sample_frequency_hz: 10000  # High frequency sampling
  adaptation_threshold: 0.05  # Adapt on 5% latency increase
  
  metrics:
    - "response_latency"
    - "interrupt_latency"
    - "context_switch_time"
    - "cache_miss_latency"
    - "memory_access_latency"

# Safety and fallback
safety:
  enable_fallback: true
  fallback_profile: "balanced"
  max_latency_violations: 10
  emergency_mode_threshold_us: 1000
  watchdog_timeout_ms: 100
