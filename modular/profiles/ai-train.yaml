
# BDI Modular Kernel - AI Training Profile
# Optimized for high-throughput AI training workloads

name: "ai-train"
type: "AI_TRAIN"
description: "Optimized for AI training workloads with high memory bandwidth and tensor operations"

# Optimization objectives (weights sum to ~2.0 for emphasis)
objectives:
  latency: 0.1      # Low priority - training can tolerate some latency
  throughput: 0.8   # High priority - maximize training throughput
  energy: 0.1       # Low priority - performance over power efficiency
  memory: 0.6       # High priority - memory bandwidth critical for training

# System constraints
constraints:
  min_freq_ghz: 3.5           # High frequency for compute-intensive operations
  max_power_watts: 400        # Allow high power consumption
  prefer_hugepages: true      # Large pages for better TLB performance
  numa_spread: false          # Keep data local for training
  min_memory_gb: 32           # Minimum memory for training workloads
  require_gpu: true           # GPU acceleration preferred

# Module preferences (in priority order)
modules:
  tensor_ops:
    - "tensor.amx"            # Intel AMX for matrix operations
    - "tensor.avx512"         # AVX-512 fallback
    - "tensor.gpu_offload"    # GPU tensor operations
  
  memory_ops:
    - "memcpy.avx512"         # Fastest memory operations
    - "memcpy.avx2"           # AVX2 fallback
    - "memcpy.streaming"      # Non-temporal for large transfers
  
  memory_management:
    - "paging.attention"      # Attention-based memory management
    - "paging.ml_prefetch"    # ML-guided prefetching
  
  scheduler:
    - "sched.graph_rt"        # Graph-aware real-time scheduler
    - "sched.batch_priority"  # Batch processing scheduler

# Memory management configuration
memory_management:
  policy: "attention"
  
  attention_config:
    learning_rate: 0.1        # Fast learning for training patterns
    recency_decay: 0.99       # Slow decay - training data reused
    hotness_learning: 0.3     # High sensitivity to access patterns
    regularization: 0.001     # Low regularization for aggressive optimization
    
    weights:
      attention: 0.5          # Balanced attention weight
      recency: 0.1            # Low recency weight - training is batch-oriented
      hotness: 0.4            # High hotness weight - favor frequently accessed
      numa_locality: 0.1      # Low NUMA weight - prefer local access
      criticality: 0.3        # Medium criticality weight
    
    thresholds:
      eviction: 0.1           # Low eviction threshold - keep more in memory
      promotion: 0.9          # High promotion threshold - be selective
      demotion: 0.05          # Very low demotion threshold
    
    update_frequency: 100     # Frequent updates for training workloads
    gc_frequency: 1000        # Regular garbage collection
    enable_prefetching: true  # Aggressive prefetching
    numa_balancing: false     # Disable NUMA balancing for training

# Hardware-specific optimizations
hardware_optimizations:
  cpu:
    prefer_features:
      - "avx512f"             # AVX-512 for wide vector operations
      - "avx512_vnni"         # Vector neural network instructions
      - "amx_tile"            # Advanced Matrix Extensions
      - "amx_int8"            # INT8 matrix operations
      - "amx_bf16"            # BF16 matrix operations
    
    cache_policy: "aggressive" # Aggressive cache utilization
    prefetch_distance: 8       # Long prefetch distance
  
  memory:
    hugepage_size: "1GB"      # Large hugepages for training datasets
    numa_policy: "local"      # Keep allocations local
    bandwidth_priority: "high" # Prioritize memory bandwidth
  
  gpu:
    unified_memory: true      # Use unified CPU/GPU memory if available
    memory_pool_size: "80%"   # Use most of GPU memory
    compute_priority: "high"  # High compute priority

# Performance targets
performance_targets:
  tensor_ops_gflops: 1000     # Target 1 TFLOPS for tensor operations
  memory_bandwidth_gbps: 400  # Target 400 GB/s memory bandwidth
  cache_hit_rate: 0.95        # Target 95% cache hit rate
  attention_update_latency_us: 10  # Target 10μs attention updates

# Monitoring and adaptation
monitoring:
  enable_performance_counters: true
  sample_frequency_hz: 1000
  adaptation_threshold: 0.1   # Adapt when performance drops 10%
  
  metrics:
    - "tensor_throughput"
    - "memory_bandwidth"
    - "cache_performance"
    - "attention_effectiveness"
    - "gpu_utilization"

# Safety and fallback
safety:
  enable_fallback: true
  fallback_profile: "balanced"
  max_adaptation_attempts: 3
  thermal_throttle_threshold: 85  # Celsius
  power_limit_enforcement: true
